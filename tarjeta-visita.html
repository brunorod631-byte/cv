<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tarjeta de visita · Bruno Rodríguez</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="assets/icon.svg?v=2" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,300..700&family=Inter:wght@300..700&display=swap" rel="stylesheet" />
  <style>
    /*
      Tarjeta tamaño tarjeta de crédito (ISO ID-1: 85,6 × 54 mm) a doble faz, estilo Mercury.
      ?modo=imprenta → 2 páginas (frente y dorso) de 91,6 × 60 mm: 3 mm de sangrado por lado.
      ?modo=a4       → 2 hojas A4 con 10 tarjetas cada una, para imprimir en casa a doble faz.
      ?tipo=socio    → versión del Plan Socio de Mantenimiento (mismo diseño, otro QR).
    */
    :root {
      --fondo: #171721; --panel: #1e1e2a; --obsidiana: #272735; --borde: #70707d;
      --suave: #c3c3cc; --texto: #ededf3; --acento: #5266eb; --blanco: #ffffff;
      --titulos: Archivo, Inter, Arial, sans-serif;
      --w: 85.6mm; --h: 54mm; --s: 0mm;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: #d9dde2; font-family: Inter, Arial, sans-serif; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    p { margin: 0; }

    .cara {
      position: relative; overflow: hidden; flex: none;
      width: calc(var(--w) + 2 * var(--s)); height: calc(var(--h) + 2 * var(--s));
      background: radial-gradient(70% 90% at 88% 0%, #2c2c40 0%, rgba(23, 23, 33, 0) 70%), var(--fondo);
      color: var(--texto);
    }
    /* Marca: anillo doble con las iniciales, como en el menú del sitio. */
    .marca { display: flex; align-items: center; gap: 2.2mm; }
    .logo {
      width: 7.4mm; height: 7.4mm; border-radius: 50%; display: grid; place-items: center;
      border: 0.25mm solid var(--texto); box-shadow: inset 0 0 0 0.7mm var(--fondo), inset 0 0 0 0.9mm rgba(237, 237, 243, 0.35);
      font-family: var(--titulos); font-stretch: 112%; font-weight: 530; font-size: 6pt; letter-spacing: 0.02em;
    }
    .web { font-size: 6pt; color: var(--suave); letter-spacing: 0.01em; }
    .pildora {
      display: inline-flex; align-items: center; height: 4.4mm; padding: 0 2.4mm; border-radius: 3mm;
      background: var(--acento); color: var(--blanco); font-size: 5.2pt; font-weight: 480; letter-spacing: 0.01em; white-space: nowrap;
    }

    /* ---- Frente ---- */
    .frente .marca { position: absolute; left: calc(var(--s) + 5.5mm); top: calc(var(--s) + 5mm); }
    .titular {
      position: absolute; left: calc(var(--s) + 5.5mm); top: calc(var(--s) + 16mm); width: 64mm;
      font-family: var(--titulos); font-stretch: 112%; font-weight: 480; font-size: 13.4pt; line-height: 1.1; letter-spacing: 0.01em;
    }
    .pie { position: absolute; left: calc(var(--s) + 5.5mm); right: calc(var(--s) + 5.5mm); bottom: calc(var(--s) + 5mm); display: flex; align-items: flex-end; justify-content: space-between; gap: 3mm; }
    .firma b { display: block; font-weight: 480; font-size: 6.6pt; }
    .firma span { display: block; margin-top: 0.6mm; font-size: 5.4pt; color: var(--suave); }

    /* ---- Dorso ---- */
    .datos { position: absolute; left: calc(var(--s) + 5.5mm); top: var(--s); bottom: var(--s); width: 44mm; display: flex; flex-direction: column; justify-content: center; }
    .nombre { font-family: var(--titulos); font-stretch: 112%; font-weight: 480; font-size: 10.6pt; line-height: 1.1; letter-spacing: 0.015em; }
    .rol { margin-top: 1.2mm; font-size: 5.6pt; color: var(--suave); line-height: 1.35; }
    .lineas { margin-top: 3.4mm; display: grid; gap: 1.6mm; }
    .linea { font-size: 6.6pt; line-height: 1.3; }
    .linea b { display: block; font-weight: 480; font-size: 5pt; color: var(--suave); letter-spacing: 0.01em; }
    .panel-qr {
      position: absolute; top: 0; right: 0; bottom: 0; width: calc(30mm + var(--s)); padding-right: var(--s);
      background: var(--panel); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2.4mm;
    }
    .qr { background: var(--texto); padding: 1.8mm; border-radius: 2mm; }
    .qr img { width: 19mm; height: 19mm; display: block; }

    /* ---- Pantalla ---- */
    .barra { max-width: 900px; margin: 16px auto; padding: 0 16px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 14px; color: #222; }
    .barra a { padding: 8px 14px; border-radius: 32px; background: #fff; color: #111; text-decoration: none; font-weight: 500; border: 1px solid #ccd; }
    .vista { display: flex; flex-wrap: wrap; gap: 24px; justify-content: center; padding: 16px; }
    .vista .cara { border-radius: 3.2mm; zoom: 1.8; }
    .hoja { display: none; }

    @media print {
      body { background: #fff; }
      .barra, .vista { display: none; }
      .hoja { display: flex; break-after: page; }
      .hoja:last-child { break-after: auto; }
    }
    /* Imprenta: una cara por página, con sangrado. */
    body.imprenta .hoja { width: 91.6mm; height: 60mm; }
    /* A4: 10 tarjetas por hoja (2 × 5), centradas. */
    body.a4 .hoja { width: 210mm; height: 297mm; flex-wrap: wrap; align-content: center; justify-content: center; gap: 4mm; padding: 0 17mm; }
  </style>
</head>
<body>
  <div class="barra">
    <a href="?modo=imprenta">PDF para imprenta</a>
    <a href="?modo=a4">PDF para imprimir en casa (A4)</a>
    <a href="?tipo=socio&modo=imprenta">Plan Socio: imprenta</a>
    <a href="?tipo=socio&modo=a4">Plan Socio: A4</a>
    <span>Frente y dorso de 85,6 × 54 mm (tamaño tarjeta de crédito).</span>
  </div>
  <div class="vista" id="vista"></div>

  <template id="t-frente">
    <div class="cara frente">
      <div class="marca"><div class="logo">BR</div><span class="web">brunorod.uy</span></div>
      <p class="titular">Que tus clientes lo vean antes de comprarlo.</p>
      <div class="pie">
        <div class="firma"><b>Bruno Rodríguez</b><span>Desarrollador freelance · Uruguay</span></div>
        <span class="pildora">Realidad Aumentada</span>
      </div>
    </div>
  </template>

  <template id="t-dorso">
    <div class="cara dorso">
      <div class="datos">
        <p class="nombre">Bruno Rodríguez</p>
        <p class="rol">Apps · Bots · Tiendas online · Realidad Aumentada</p>
        <div class="lineas">
          <p class="linea"><b>WhatsApp</b>098 611 824</p>
          <p class="linea"><b>Email</b>bruno@brunorod.uy</p>
          <p class="linea"><b>Web</b>brunorod.uy</p>
        </div>
      </div>
      <div class="panel-qr">
        <div class="qr"><img src="assets/qr-web.svg" alt="QR a brunorod.uy" /></div>
        <span class="pildora">Escaneá y mirá mi trabajo</span>
      </div>
    </div>
  </template>

  <template id="t-frente-socio">
    <div class="cara frente">
      <div class="marca"><div class="logo">BR</div><span class="web">brunorod.uy</span></div>
      <p class="titular">Plan Socio de Mantenimiento</p>
      <div class="pie">
        <div class="firma"><b>Para tu edificio · tu casa · tu comercio</b><span>Solo pagás los materiales</span></div>
        <span class="pildora">$ 650 por mes</span>
      </div>
    </div>
  </template>

  <template id="t-dorso-socio">
    <div class="cara dorso">
      <div class="datos">
        <p class="nombre">Plan Socio</p>
        <p class="rol">Mano de obra incluida · $ 650 por mes</p>
        <div class="lineas">
          <p class="linea"><b>Hogar</b>Electricidad, sanitaria, calefón y pintura</p>
          <p class="linea"><b>Armado y colocación</b>Muebles, cortinas roller, estantes</p>
          <p class="linea"><b>Tecnología</b>WiFi, internet y cámaras de seguridad</p>
          <p class="linea"><b>Bruno Rodríguez · WhatsApp</b>098 611 824</p>
        </div>
      </div>
      <div class="panel-qr">
        <div class="qr"><img src="assets/qr-socio.svg" alt="QR al Plan Socio" /></div>
        <span class="pildora">Escaneá y mirá qué incluye</span>
      </div>
    </div>
  </template>

  <script>
    const params = new URLSearchParams(location.search);
    const modo = params.get('modo') === 'a4' ? 'a4' : 'imprenta';
    // ?tipo=socio usa la versión del Plan Socio de Mantenimiento.
    const sufijo = params.get('tipo') === 'socio' ? '-socio' : '';
    document.body.classList.add(modo);
    const cara = (id) => document.getElementById(id).content.cloneNode(true);
    // Tamaño de página según el modo (Chrome toma el @page para el PDF).
    const pagina = document.createElement('style');
    pagina.textContent = modo === 'a4' ? '@page { size: A4; margin: 0; }' : '@page { size: 91.6mm 60mm; margin: 0; }';
    document.head.append(pagina);
    if (modo === 'imprenta') document.documentElement.style.setProperty('--s', '3mm');

    // Vista previa en pantalla: frente y dorso.
    for (const id of ['t-frente', 't-dorso']) document.getElementById('vista').append(cara(id + sufijo));

    // Hojas para imprimir.
    for (const id of ['t-frente', 't-dorso']) {
      const hoja = document.createElement('div');
      hoja.className = 'hoja';
      for (let i = 0; i < (modo === 'a4' ? 10 : 1); i++) hoja.append(cara(id + sufijo));
      document.body.append(hoja);
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tarjetas para imprimir · Bruno Rodríguez</title>
  <meta name="robots" content="noindex" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet" />
  <style>
    /* Hoja A4 con 10 tarjetas de 85 × 55 mm (2 columnas × 5 filas). ?tipo=socio muestra la del Plan Socio. */
    @page { size: A4; margin: 0; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #e5e8ec; font-family: Inter, Arial, sans-serif; color: #111; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .barra { max-width: 210mm; margin: 16px auto; padding: 0 16px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 14px; }
    .barra a { padding: 8px 14px; border-radius: 8px; background: #fff; color: #111; text-decoration: none; font-weight: 600; border: 1px solid #ccd; }
    .barra a.on { background: #111; color: #fff; }
    .hoja {
      width: 210mm; height: 297mm; margin: 0 auto 24px; background: #fff;
      padding: 11mm 20mm; display: grid; grid-template-columns: repeat(2, 85mm); grid-auto-rows: 55mm;
      justify-content: center; align-content: center; gap: 0;
    }
    .tarjeta {
      position: relative; width: 85mm; height: 55mm; overflow: hidden;
      display: grid; grid-template-columns: 1fr 30mm; gap: 3mm; padding: 5mm 5mm 5mm 6mm;
      outline: 0.2mm dashed #c4c8ce; outline-offset: -0.1mm;
    }
    .tarjeta::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 1.6mm; background: #f5a524; }
    .texto { display: flex; flex-direction: column; min-width: 0; }
    .kicker { font-size: 6.2pt; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: #b3700a; margin: 0; }
    h1 { font-size: 13pt; line-height: 1.1; margin: 1mm 0 0; font-weight: 800; letter-spacing: -0.01em; }
    .rol { font-size: 7.4pt; line-height: 1.3; margin: 1.2mm 0 0; color: #333; }
    .precio { font-size: 12pt; font-weight: 800; margin: 1.5mm 0 0; }
    .precio small { font-size: 7pt; font-weight: 600; color: #555; }
    .contacto { margin-top: auto; font-size: 7.2pt; line-height: 1.45; color: #111; }
    .contacto b { font-weight: 600; }
    .qr { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
    .qr img { width: 28mm; height: 28mm; display: block; }
    .qr span { font-size: 6pt; line-height: 1.2; margin-top: 1mm; color: #333; font-weight: 600; }
    @media print { body { background: #fff; } .barra { display: none; } .hoja { margin: 0; } }
    @media screen and (max-width: 840px) { .hoja { transform-origin: top left; } }
  </style>
</head>
<body>
  <div class="barra">
    <a href="?tipo=cv" id="l-cv">Tarjeta general</a>
    <a href="?tipo=socio" id="l-socio">Tarjeta Plan Socio</a>
    <span>Imprimí con Ctrl+P, tamaño A4, márgenes «Ninguno», escala 100 %.</span>
  </div>
  <div class="hoja" id="hoja"></div>

  <template id="t-cv">
    <div class="tarjeta">
      <div class="texto">
        <p class="kicker">Desarrollador · Uruguay</p>
        <h1>Bruno Rodríguez</h1>
        <p class="rol">Apps, bots, páginas web y Realidad Aumentada para tu negocio.</p>
        <div class="contacto">
          <b>WhatsApp</b> 098 611 824<br />
          brunorod631@gmail.com
        </div>
      </div>
      <div class="qr">
        <img src="assets/qr-cv.svg" alt="QR a la página" />
        <span>Escaneá y mirá<br />mi trabajo</span>
      </div>
    </div>
  </template>

  <template id="t-socio">
    <div class="tarjeta">
      <div class="texto">
        <p class="kicker">Para tu edificio o tu casa</p>
        <h1>Plan Socio de Mantenimiento</h1>
        <p class="rol">Electricidad, sanitaria, calefón, armado de muebles, WiFi y cámaras. Solo pagás los materiales.</p>
        <p class="precio">$ 650 <small>por mes</small></p>
        <div class="contacto"><b>Bruno Rodríguez</b> · 098 611 824</div>
      </div>
      <div class="qr">
        <img src="assets/qr-mantenimiento.svg" alt="QR al Plan Socio" />
        <span>Escaneá y mirá<br />qué incluye</span>
      </div>
    </div>
  </template>

  <script>
    const tipo = new URLSearchParams(location.search).get('tipo') === 'socio' ? 'socio' : 'cv';
    document.getElementById('l-' + tipo).classList.add('on');
    const t = document.getElementById('t-' + tipo);
    for (let i = 0; i < 10; i++) document.getElementById('hoja').append(t.content.cloneNode(true));
  </script>
</body>
</html>
